<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Left & Right Pot Handles -->
  <path d="M 45 90 C 30 90, 30 120, 45 120" fill="none" stroke="#FFB000" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 155 90 C 170 90, 170 120, 155 120" fill="none" stroke="#FFB000" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Pot Rim -->
  <rect x="45" y="65" width="110" height="12" rx="3" fill="#FFB000" filter="url(#glow)" />

  <!-- Pot Body -->
  <path d="M 50 82 C 50 145, 65 165, 100 165 C 135 165, 150 145, 150 82 Z" fill="none" stroke="#FFB000" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
</svg>
